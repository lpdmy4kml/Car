<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極速陀螺儀賽車 3D - Gyro Racing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050508;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .touch-btn:active {
            background: rgba(59, 130, 246, 0.5);
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-950 text-white select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- START / PERMISSION OVERLAY MENU -->
    <div id="start-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-between p-6 bg-slate-950/90 backdrop-blur-md overflow-y-auto">
        <div class="mt-4 text-center">
            <h1 class="text-3xl md:text-5xl font-black italic tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-600">
                極速陀螺儀 3D
            </h1>
            <p class="text-xs md:text-sm text-slate-300 mt-1 font-medium">手機傾斜感應賽車體驗</p>
        </div>

        <!-- Sensor Diagnostics Display Card -->
        <div class="w-full max-w-sm bg-slate-900/90 p-4 rounded-2xl border border-slate-700/60 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-microchip"></i> 感應器狀態 (Live Sensor)
                </h3>
                <span id="active-sensor-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400 border border-slate-700">未連接</span>
            </div>
            
            <div id="sensor-diag" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono space-y-1.5">
                <div class="flex justify-between text-slate-400">
                    <span>模式 Source:</span>
                    <span id="diag-source" class="text-amber-400 font-bold">待檢測 Unchecked</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>左右角度 / 加速度:</span>
                    <span id="diag-val" class="text-cyan-400 font-bold">0.0</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>計算傾斜 Steering:</span>
                    <span id="diag-steer" class="text-emerald-400 font-bold">0.0°</span>
                </div>
            </div>

            <div class="text-[11px] text-slate-400 leading-relaxed space-y-1">
                <p><i class="fa-solid fa-circle-info text-cyan-400 mr-1"></i> 請按下下方「啟動陀螺儀」授權感應器。</p>
                <p><i class="fa-solid fa-hand text-amber-400 mr-1"></i> 如未獲回應，系統會自動使用 Accelerometer 或觸控按鈕備援。</p>
            </div>
        </div>

        <!-- Start Buttons -->
        <div class="w-full max-w-sm space-y-2.5 my-4">
            <button id="start-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-base text-white shadow-lg shadow-cyan-500/30 hover:brightness-110 active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 啟用陀螺儀並開始遊戲
            </button>
            <button id="calibrate-start-btn" class="w-full py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-semibold text-cyan-300 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrows-to-dot"></i> 校正當前手機姿勢為中心 (Zero Center)
            </button>
            <button id="touch-only-btn" class="w-full py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-400 hover:text-slate-200 active:scale-95 transition">
                使用螢幕 Touch 按鈕模式
            </button>
        </div>
    </div>

    <!-- IN-GAME HUD -->
    <div id="hud-overlay" class="absolute inset-0 z-10 pointer-events-none hidden flex-col justify-between p-4 md:p-6">
        <!-- Top Info Bar -->
        <div class="flex justify-between items-start">
            <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-xl p-2.5 px-3.5 shadow-lg flex items-center gap-3">
                <div>
                    <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">分數</div>
                    <div id="score-val" class="text-lg font-black text-cyan-400 tracking-wide">0</div>
                </div>
                <div class="h-6 w-px bg-slate-700/80"></div>
                <div>
                    <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">金幣</div>
                    <div id="coin-val" class="text-lg font-black text-amber-400 flex items-center gap-1">
                        <i class="fa-solid fa-coins text-xs"></i> <span id="coin-count">0</span>
                    </div>
                </div>
            </div>

            <!-- Sensor Gauge HUD -->
            <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-xl p-2 px-3 shadow-lg flex flex-col items-center min-w-[110px]">
                <div id="gyro-hud-status" class="text-[10px] font-bold text-cyan-400 mb-1 flex items-center gap-1">
                    <i class="fa-solid fa-compass"></i> 陀螺儀運作中
                </div>
                <div class="w-20 h-2 bg-slate-800 rounded-full overflow-hidden relative border border-slate-700">
                    <div id="gyro-meter" class="w-2.5 h-full bg-cyan-400 rounded-full absolute left-1/2 -translate-x-1/2 transition-transform duration-75"></div>
                </div>
                <div id="gyro-angle-text" class="text-[9px] text-cyan-300 font-mono mt-0.5">0.0°</div>
            </div>

            <!-- Pause Button -->
            <button id="pause-btn" class="pointer-events-auto w-10 h-10 rounded-xl bg-slate-900/80 border border-slate-700/60 flex items-center justify-center text-slate-200 active:scale-90 transition">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
        </div>

        <!-- Bottom Speedometer & Controls -->
        <div class="flex justify-between items-end">
            <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-2.5 px-3.5 shadow-lg">
                <div class="text-[9px] text-slate-400 uppercase tracking-wider font-bold">時速 SPEED</div>
                <div class="flex items-baseline gap-1">
                    <span id="speed-val" class="text-2xl font-black italic text-white tracking-wider">0</span>
                    <span class="text-[10px] font-semibold text-cyan-400">KM/H</span>
                </div>
                <div class="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden mt-1 border border-slate-700">
                    <div id="nitro-bar" class="h-full bg-gradient-to-r from-amber-400 to-orange-500 w-0 transition-all"></div>
                </div>
            </div>

            <!-- On-Screen Touch Controls (Fallback) -->
            <div id="touch-controls" class="pointer-events-auto flex gap-2">
                <button id="btn-left" class="touch-btn w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="btn-right" class="touch-btn w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button id="btn-nitro" class="touch-btn w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-gradient-to-br from-amber-500/40 to-orange-600/40 border border-amber-400/50 flex items-center justify-center text-amber-300 text-xl active:scale-95">
                    <i class="fa-solid fa-bolt"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- PAUSE / SETTINGS MODAL -->
    <div id="pause-modal" class="absolute inset-0 z-40 hidden bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-700/80 rounded-2xl p-5 shadow-2xl space-y-4">
            <h2 class="text-xl font-black text-cyan-400 text-center border-b border-slate-800 pb-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-sliders"></i> 遊戲暫停 & 設定
            </h2>

            <div class="space-y-3">
                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                        <span>陀螺儀靈敏度 Sensitivity</span>
                        <span id="sens-val-text" class="text-cyan-400">1.8x</span>
                    </div>
                    <input id="sens-slider" type="range" min="0.5" max="3.5" step="0.1" value="1.8" class="w-full accent-cyan-400 bg-slate-800 rounded-lg">
                </div>

                <button id="calibrate-btn" class="w-full py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-to-dot text-cyan-400"></i> 重設當前角度為中心 (Recalibration)
                </button>
            </div>

            <div class="space-y-2 pt-2 border-t border-slate-800">
                <button id="resume-btn" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white shadow-lg active:scale-95 transition">
                    繼續遊戲
                </button>
                <button id="restart-btn" class="w-full py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300 active:scale-95 transition">
                    重新開始
                </button>
            </div>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="gameover-modal" class="absolute inset-0 z-40 hidden bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-slate-900 border border-red-500/30 rounded-2xl p-6 shadow-2xl text-center space-y-4">
            <div class="w-14 h-14 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-500 text-2xl mx-auto">
                <i class="fa-solid fa-car-burst"></i>
            </div>

            <div>
                <h2 class="text-2xl font-black text-white">撞車事故！</h2>
                <p class="text-xs text-slate-400 mt-0.5">GAME OVER</p>
            </div>

            <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80 space-y-1.5 text-xs">
                <div class="flex justify-between text-slate-400">
                    <span>本次得分</span>
                    <span id="final-score" class="font-bold text-cyan-400 text-sm">0</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>獲得金幣</span>
                    <span id="final-coins" class="font-bold text-amber-400 text-sm">0</span>
                </div>
                <div class="h-px bg-slate-800"></div>
                <div class="flex justify-between text-slate-300 font-bold">
                    <span>最高紀錄 High Score</span>
                    <span id="high-score" class="text-emerald-400 text-sm">0</span>
                </div>
            </div>

            <button id="retry-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white shadow-lg shadow-cyan-500/30 hover:brightness-110 active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> 再玩一次
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer ---
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.engineOsc = null;
                this.engineGain = null;
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                this.ctx = new AudioCtx();

                this.engineOsc = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.setValueAtTime(40, this.ctx.currentTime);
                this.engineGain.gain.setValueAtTime(0.03, this.ctx.currentTime);
                
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(260, this.ctx.currentTime);

                this.engineOsc.connect(filter);
                filter.connect(this.engineGain);
                this.engineGain.connect(this.ctx.destination);
                this.engineOsc.start();
            }

            updateEnginePitch(speed) {
                if (!this.ctx || !this.engineOsc) return;
                const pitch = 35 + (speed * 0.85);
                this.engineOsc.frequency.setTargetAtTime(pitch, this.ctx.currentTime, 0.1);
            }

            playCoin() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            }

            playNitro() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(550, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playCrash() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.4;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.35);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
        }

        const audio = new SoundEffects();

        // --- Triple-Fallback Gyroscope Engine ---
        let sensorMode = 'NONE'; // 'ORIENTATION' | 'MOTION' | 'TOUCH'
        let rawInputValue = 0;
        let zeroOffsetValue = 0;
        let smoothedCalculatedTilt = 0;

        let gyroSensitivity = 1.8;
        let deadzone = 0.8;

        function updateSensorDiagnostics(mode, raw, steer) {
            sensorMode = mode;
            rawInputValue = raw;

            const badge = document.getElementById('active-sensor-badge');
            const sourceElem = document.getElementById('diag-source');
            const valElem = document.getElementById('diag-val');
            const steerElem = document.getElementById('diag-steer');

            valElem.innerText = raw.toFixed(2);
            steerElem.innerText = `${steer.toFixed(1)}°`;

            if (mode === 'ORIENTATION') {
                badge.innerText = 'DeviceOrientation';
                badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-950 text-cyan-400 border border-cyan-700';
                sourceElem.innerText = '角度 Orientation (Gamma)';
                sourceElem.className = 'text-cyan-400 font-bold';
            } else if (mode === 'MOTION') {
                badge.innerText = 'DeviceMotion Accel';
                badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-700';
                sourceElem.innerText = '加速度 Accelerometer X';
                sourceElem.className = 'text-emerald-400 font-bold';
            } else {
                badge.innerText = 'Touch Screen';
                badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-700';
                sourceElem.innerText = '螢幕觸控 Touch Buttons';
                sourceElem.className = 'text-amber-400 font-bold';
            }

            setGyroActiveHUD(mode !== 'TOUCH');
        }

        function setGyroActiveHUD(active) {
            const hudStatus = document.getElementById('gyro-hud-status');
            if (active) {
                hudStatus.innerHTML = `<i class="fa-solid fa-compass text-emerald-400"></i> <span class="text-emerald-400">${sensorMode}</span>`;
            } else {
                hudStatus.innerHTML = `<i class="fa-solid fa-hand text-amber-400"></i> <span class="text-amber-400">觸控模式</span>`;
            }
        }

        async function initSensors() {
            let orientationSuccess = false;
            let motionSuccess = false;

            // 1. Try DeviceOrientation permission (iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const res = await DeviceOrientationEvent.requestPermission();
                    if (res === 'granted') orientationSuccess = true;
                } catch (e) { console.warn('DeviceOrientation Request Failed:', e); }
            } else if (window.DeviceOrientationEvent) {
                orientationSuccess = true;
            }

            // 2. Try DeviceMotion permission as backup
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const resM = await DeviceMotionEvent.requestPermission();
                    if (resM === 'granted') motionSuccess = true;
                } catch (e) { console.warn('DeviceMotion Request Failed:', e); }
            } else if (window.DeviceMotionEvent) {
                motionSuccess = true;
            }

            // Attach listeners
            window.addEventListener('deviceorientation', handleOrientation, true);
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('devicemotion', handleMotion, true);

            setTimeout(() => {
                if (sensorMode === 'NONE') {
                    updateSensorDiagnostics('TOUCH', 0, 0);
                }
            }, 800);
        }

        function handleOrientation(event) {
            let g = event.gamma; // [-90, 90]
            if (g === null || g === undefined) return;

            // Orientation adaptation
            if (window.orientation === 90) g = -event.beta;
            else if (window.orientation === -90) g = event.beta;

            let delta = g - zeroOffsetValue;
            if (Math.abs(delta) < deadzone) delta = 0;

            const calculatedSteer = delta * gyroSensitivity;
            updateSensorDiagnostics('ORIENTATION', g, calculatedSteer);
        }

        function handleMotion(event) {
            if (sensorMode === 'ORIENTATION') return; // Orientation takes priority if working

            const accel = event.accelerationIncludingGravity;
            if (!accel || accel.x === null) return;

            // Accel X gives lateral tilt force
            let rawX = accel.x; 
            if (window.orientation === 90) rawX = -accel.y;
            else if (window.orientation === -90) rawX = accel.y;

            let delta = rawX - zeroOffsetValue;
            if (Math.abs(delta) < deadzone * 0.2) delta = 0;

            // Convert acceleration force to steer angle
            const calculatedSteer = delta * 6.5 * gyroSensitivity;
            updateSensorDiagnostics('MOTION', rawX, calculatedSteer);
        }

        function calibrateZeroCenter() {
            zeroOffsetValue = rawInputValue;
            alert('重設完成！已將當前姿勢設為中心點。');
        }

        // --- Three.js 3D Engine Setup ---
        let scene, camera, renderer;
        let playerCar, road, roadLines = [], roadsideProps = [];
        let obstacles = [], collectibles = [];
        let isPlaying = false, isPaused = false;

        let playerX = 0;
        let currentSpeed = 0;
        const maxSpeed = 125;
        const baseSpeed = 65;
        let nitroAmount = 100;
        let isBoosting = false;
        let score = 0, coins = 0, distanceTraveled = 0;

        let touchLeft = false, touchRight = false;
        let shakeIntensity = 0;
        let highScore = localStorage.getItem('gyro_racing_highscore') || 0;

        function initScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070913);
            scene.fog = new THREE.FogExp2(0x070913, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createRoadEnvironment();

            playerCar = createPlayerCarMesh();
            playerCar.position.set(0, 0, 0);
            scene.add(playerCar);

            window.addEventListener('resize', onWindowResize);
        }

        function createRoadEnvironment() {
            const roadGeo = new THREE.PlaneGeometry(12, 300);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1c23, roughness: 0.8 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            road.receiveShadow = true;
            scene.add(road);

            const sideGeo = new THREE.PlaneGeometry(100, 300);
            const sideMat = new THREE.MeshStandardMaterial({ color: 0x080d1a });
            
            const leftSide = new THREE.Mesh(sideGeo, sideMat);
            leftSide.rotation.x = -Math.PI / 2;
            leftSide.position.set(-56, -0.05, -100);
            scene.add(leftSide);

            const rightSide = new THREE.Mesh(sideGeo, sideMat);
            rightSide.rotation.x = -Math.PI / 2;
            rightSide.position.set(56, -0.05, -100);
            scene.add(rightSide);

            const lineGeo = new THREE.PlaneGeometry(0.3, 4);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

            for (let i = 0; i < 25; i++) {
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.02, -i * 12);
                scene.add(line);
                roadLines.push(line);
            }

            for (let i = 0; i < 15; i++) {
                const lampL = createStreetLamp();
                lampL.position.set(-6.8, 0, -i * 20);
                scene.add(lampL);
                roadsideProps.push(lampL);

                const lampR = createStreetLamp();
                lampR.position.set(6.8, 0, -i * 20 - 10);
                lampR.rotation.y = Math.PI;
                scene.add(lampR);
                roadsideProps.push(lampR);
            }
        }

        function createStreetLamp() {
            const group = new THREE.Group();
            const poleGeo = new THREE.CylinderGeometry(0.08, 0.12, 5);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = 2.5;
            group.add(pole);

            const lightGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const lightMesh = new THREE.Mesh(lightGeo, lightMat);
            lightMesh.position.set(0.5, 4.8, 0);
            group.add(lightMesh);

            return group;
        }

        function createPlayerCarMesh() {
            const carGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.6, 0.6, 3.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.45;
            body.castShadow = true;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.2, 0.5, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.85, -0.2);
            carGroup.add(cabin);

            const lightGeo = new THREE.BoxGeometry(0.35, 0.15, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            
            const hlLeft = new THREE.Mesh(lightGeo, lightMat);
            hlLeft.position.set(-0.55, 0.45, -1.6);
            carGroup.add(hlLeft);

            const hlRight = new THREE.Mesh(lightGeo, lightMat);
            hlRight.position.set(0.55, 0.45, -1.6);
            carGroup.add(hlRight);

            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            
            const wheelPositions = [
                [-0.85, 0.35, -1.0], [0.85, 0.35, -1.0],
                [-0.85, 0.35, 1.0], [0.85, 0.35, 1.0]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        function createTrafficCarMesh(colorHex) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.5, 0.65, 3.0);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.45;
            body.castShadow = true;
            group.add(body);
            return group;
        }

        function createCoinMesh() {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.x = Math.PI / 2;
            coin.position.y = 0.6;
            return coin;
        }

        function spawnObstacleOrCollectible() {
            if (!isPlaying || isPaused) return;

            const lanes = [-3.8, -1.2, 1.2, 3.8];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const spawnZ = -120;

            if (Math.random() < 0.65) {
                const colors = [0xd97706, 0x059669, 0x7c3aed, 0xef4444];
                const trafficCar = createTrafficCarMesh(colors[Math.floor(Math.random() * colors.length)]);
                trafficCar.position.set(lane, 0, spawnZ);
                scene.add(trafficCar);
                obstacles.push(trafficCar);
            } else {
                const coin = createCoinMesh();
                coin.position.set(lane, 0.6, spawnZ);
                scene.add(coin);
                collectibles.push(coin);
            }
        }

        function setupControls() {
            document.getElementById('start-btn').addEventListener('click', async () => {
                audio.init();
                await initSensors();
                startGame();
            });

            document.getElementById('touch-only-btn').addEventListener('click', () => {
                audio.init();
                updateSensorDiagnostics('TOUCH', 0, 0);
                startGame();
            });

            document.getElementById('calibrate-start-btn').addEventListener('click', calibrateZeroCenter);
            document.getElementById('calibrate-btn').addEventListener('click', calibrateZeroCenter);

            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnNitro = document.getElementById('btn-nitro');

            const bindBtn = (elem, onPress, onRelease) => {
                elem.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
                elem.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
                elem.addEventListener('mousedown', onPress);
                elem.addEventListener('mouseup', onRelease);
            };

            bindBtn(btnLeft, () => touchLeft = true, () => touchLeft = false);
            bindBtn(btnRight, () => touchRight = true, () => touchRight = false);
            bindBtn(btnNitro, () => isBoosting = true, () => isBoosting = false);

            document.getElementById('pause-btn').addEventListener('click', pauseGame);
            document.getElementById('resume-btn').addEventListener('click', resumeGame);
            document.getElementById('restart-btn').addEventListener('click', () => { resumeGame(); startGame(); });
            document.getElementById('retry-btn').addEventListener('click', startGame);

            const sensSlider = document.getElementById('sens-slider');
            sensSlider.addEventListener('input', (e) => {
                gyroSensitivity = parseFloat(e.target.value);
                document.getElementById('sens-val-text').innerText = gyroSensitivity.toFixed(1) + 'x';
            });
        }

        function startGame() {
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('pause-modal').classList.add('hidden');
            document.getElementById('hud-overlay').classList.remove('hidden');
            document.getElementById('hud-overlay').classList.add('flex');

            playerX = 0;
            currentSpeed = baseSpeed;
            score = 0;
            coins = 0;
            distanceTraveled = 0;
            nitroAmount = 100;
            isPlaying = true;
            isPaused = false;

            obstacles.forEach(o => scene.remove(o));
            collectibles.forEach(c => scene.remove(c));
            obstacles = [];
            collectibles = [];

            document.getElementById('high-score').innerText = highScore;
        }

        function pauseGame() { isPaused = true; document.getElementById('pause-modal').classList.remove('hidden'); }
        function resumeGame() { isPaused = false; document.getElementById('pause-modal').classList.add('hidden'); }

        function gameOver() {
            isPlaying = false;
            audio.playCrash();
            shakeIntensity = 0.5;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('gyro_racing_highscore', highScore);
            }

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coins;
            document.getElementById('high-score').innerText = highScore;

            setTimeout(() => {
                document.getElementById('gameover-modal').classList.remove('hidden');
            }, 500);
        }

        let spawnTimer = 0;
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (isPlaying && !isPaused) {
                updatePhysics(delta);
                updateEnvironment(delta);
                checkCollisions();
            }

            if (shakeIntensity > 0) {
                camera.position.x = (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = 3.5 + (Math.random() - 0.5) * shakeIntensity;
                shakeIntensity -= delta * 1.5;
            } else {
                camera.position.x = playerCar ? playerCar.position.x * 0.3 : 0;
                camera.position.y = 3.5;
            }

            renderer.render(scene, camera);
        }

        function updatePhysics(delta) {
            let targetTiltAngle = 0;

            if (sensorMode === 'ORIENTATION') {
                let deltaVal = rawInputValue - zeroOffsetValue;
                if (Math.abs(deltaVal) < deadzone) deltaVal = 0;
                targetTiltAngle = deltaVal * gyroSensitivity;
            } else if (sensorMode === 'MOTION') {
                let deltaVal = rawInputValue - zeroOffsetValue;
                if (Math.abs(deltaVal) < deadzone * 0.2) deltaVal = 0;
                targetTiltAngle = deltaVal * 6.5 * gyroSensitivity;
            }

            // Touch Override
            if (touchLeft) targetTiltAngle = -28 * gyroSensitivity;
            if (touchRight) targetTiltAngle = 28 * gyroSensitivity;

            // Smoothed Lerp
            smoothedCalculatedTilt += (targetTiltAngle - smoothedCalculatedTilt) * 0.18;
            const clampedTilt = Math.max(-35, Math.min(35, smoothedCalculatedTilt));

            const steerFactor = clampedTilt / 35;
            playerX += steerFactor * 13 * delta;
            playerX = Math.max(-4.8, Math.min(4.8, playerX));

            playerCar.position.x = playerX;
            playerCar.rotation.z = -steerFactor * 0.22;
            playerCar.rotation.y = -steerFactor * 0.15;

            // Speed & Boost logic
            if (isBoosting && nitroAmount > 0) {
                currentSpeed = maxSpeed;
                nitroAmount -= delta * 40;
                audio.playNitro();
            } else {
                currentSpeed = baseSpeed;
                if (nitroAmount < 100) nitroAmount += delta * 12;
            }

            audio.updateEnginePitch(currentSpeed);

            // Update UI Displays
            document.getElementById('speed-val').innerText = Math.floor(currentSpeed);
            document.getElementById('score-val').innerText = score;
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('nitro-bar').style.width = `${Math.max(0, nitroAmount)}%`;

            // HUD Gauge Meter
            const meterElem = document.getElementById('gyro-meter');
            const angleText = document.getElementById('gyro-angle-text');
            const pxOffset = Math.max(-30, Math.min(30, (clampedTilt / 35) * 30));
            meterElem.style.transform = `translateX(${pxOffset}px)`;
            angleText.innerText = `${clampedTilt.toFixed(1)}°`;

            distanceTraveled += currentSpeed * delta;
            score = Math.floor(distanceTraveled * 0.2);
        }

        function updateEnvironment(delta) {
            const moveSpeed = currentSpeed * delta * 1.5;

            roadLines.forEach(line => {
                line.position.z += moveSpeed;
                if (line.position.z > 10) line.position.z -= 300;
            });

            roadsideProps.forEach(prop => {
                prop.position.z += moveSpeed;
                if (prop.position.z > 10) prop.position.z -= 300;
            });

            spawnTimer += delta;
            if (spawnTimer > (1.1 - (currentSpeed / 260))) {
                spawnObstacleOrCollectible();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += moveSpeed * 0.6;
                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const item = collectibles[i];
                item.position.z += moveSpeed;
                item.rotation.z += delta * 3;
                if (item.position.z > 15) {
                    scene.remove(item);
                    collectibles.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            const carBox = new THREE.Box3().setFromObject(playerCar);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obsBox = new THREE.Box3().setFromObject(obstacles[i]);
                if (carBox.intersectsBox(obsBox)) {
                    gameOver();
                    return;
                }
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const coinBox = new THREE.Box3().setFromObject(collectibles[i]);
                if (carBox.intersectsBox(coinBox)) {
                    scene.remove(collectibles[i]);
                    collectibles.splice(i, 1);
                    coins += 1;
                    score += 50;
                    audio.playCoin();
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            initScene();
            setupControls();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
